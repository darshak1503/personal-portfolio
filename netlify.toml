[build.environment]
  # EmailJS service ID, template ID and public key are designed to be used in
  # the browser. Next.js inlines NEXT_PUBLIC_* values into the client bundle,
  # so exclude them from Netlify's secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_EMAILJS_PUBLIC_KEY,NEXT_PUBLIC_EMAILJS_SERVICE_ID,NEXT_PUBLIC_EMAILJS_TEMPLATE_ID"
